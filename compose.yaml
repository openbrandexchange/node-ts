# Self-hosting with Docker Compose: `docker compose up -d`, then open http://localhost:8080
# The setup code is printed in the log (`docker compose logs portal`). Optional settings go in a .env
# file next to this file (see .env.example); without OBX_SECRET_KEY one is generated into the volume.
services:
  portal:
    # No fixed image name: Compose names the build after the project (the folder), so two
    # checkouts on one machine do not overwrite each other's image.
    build: .
    restart: unless-stopped
    ports:
      - "${OBX_PORT:-8080}:8080"
    environment:
      OBX_PUBLIC_URL: ${OBX_PUBLIC_URL:-http://localhost:${OBX_PORT:-8080}}
      OBX_SECRET_KEY: ${OBX_SECRET_KEY:-}
      OBX_SETUP_CODE: ${OBX_SETUP_CODE:-}
      OBX_MAIL_PROVIDER: ${OBX_MAIL_PROVIDER:-}
      OBX_MAIL_API_KEY: ${OBX_MAIL_API_KEY:-}
      OBX_MAIL_FROM: ${OBX_MAIL_FROM:-}
      # Files on the volume by default; switch to the bundled S3 server with OBX_STORAGE=s3 (profile "s3").
      OBX_STORAGE: ${OBX_STORAGE:-disk}
      OBX_S3_ENDPOINT: ${OBX_S3_ENDPOINT:-http://s3:9000}
      OBX_S3_CREATE_BUCKET: "true"
      OBX_S3_BUCKET: ${OBX_S3_BUCKET:-portal}
      OBX_S3_REGION: ${OBX_S3_REGION:-us-east-1}
      OBX_S3_ACCESS_KEY_ID: ${OBX_S3_ACCESS_KEY_ID:-portal}
      OBX_S3_SECRET_ACCESS_KEY: ${OBX_S3_SECRET_ACCESS_KEY:-portal-secret-change-me}
    volumes:
      - portal-data:/data
    # Graceful stop: the portal finishes running requests and job steps (OBX_SHUTDOWN_TIMEOUT_MS, 20 s).
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1g
        reservations:
          memory: 256m
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"

  # Optional local S3-compatible storage (RustFS): `docker compose --profile s3 up -d` with OBX_STORAGE=s3.
  s3:
    profiles: ["s3"]
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${OBX_S3_ACCESS_KEY_ID:-portal}
      RUSTFS_SECRET_KEY: ${OBX_S3_SECRET_ACCESS_KEY:-portal-secret-change-me}
    volumes:
      - s3-data:/data

volumes:
  portal-data:
  s3-data:
