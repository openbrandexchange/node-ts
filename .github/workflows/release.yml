name: Release
# Runs only when a version tag (v1.2.3 or v1.2.3-rc.1) is pushed. Nothing is released by merging.
# Produces a draft GitHub release (the owner reviews and publishes it) and pushes the Docker image.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - id: v
        name: Tag, package.json and code agree on the version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun -e 'console.log(require("./package.json").version)')"
          code="$(sed -n 's/^export const VERSION = "\(.*\)";$/\1/p' src/adapters/shared/config.ts)"
          echo "tag=$tag package.json=$pkg code=$code"
          test "$tag" = "$pkg" && test "$tag" = "$code"
          grep -q "^## \[$tag\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $tag"; exit 1; }
          echo "version=$tag" >>"$GITHUB_OUTPUT"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run audit
      - run: bun run licenses

  files:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - name: Build binaries, Cloudflare bundle and source archive
        run: sh scripts/build-release.sh "${{ needs.verify.outputs.version }}"
      - name: SBOM of the shipped dependencies (SPDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/obx-node-ts-${{ needs.verify.outputs.version }}.spdx.json
          upload-artifact: false
      - name: Checksums
        working-directory: dist/release
        run: |
          rm -f SHA256SUMS
          shasum -a 256 -- * >"$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md >notes.md
          cat notes.md
      - name: Draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: ${{ contains(needs.verify.outputs.version, '-') }}
          name: Portal for Cloudflare ${{ needs.verify.outputs.version }}
          body_path: notes.md
          files: dist/release/*

  image:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openbrandexchange/node-ts
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(needs.verify.outputs.version, '-') }}
          labels: |
            org.opencontainers.image.title=Open Brand Exchange · Portal for Cloudflare (Bun build)
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.vendor=Open Brand Exchange Foundation (in formation)
      - id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/openbrandexchange/node-ts
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
