name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"
      - run: bun install --frozen-lockfile
      - run: bun scripts/gen-migrations.ts && git diff --exit-code src/db/migrations.gen.ts
      - run: bun run typecheck
      - run: bun test
      - run: bunx wrangler deploy --dry-run --outdir dist
      - run: bun run smoke:workers
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t brand-portal .
      - run: |
          docker run -d --name portal -p 8080:8080 -e OBX_SECRET_KEY=ci-secret-key-0123456789abcdefghijkl brand-portal
          for i in $(seq 1 30); do curl -fs http://localhost:8080/healthz && break; sleep 1; done
          curl -fs http://localhost:8080/admin/api/setup | grep -q '"required":true'
