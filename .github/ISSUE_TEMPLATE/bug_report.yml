name: Bug report
description: Something in the portal does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security problems: do **not** file an issue. E-mail security@openbrandexchange.com (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Imports\n2. Upload …\n3. …"
    validations:
      required: true
  - type: dropdown
    id: hosting
    attributes:
      label: Where does the portal run?
      options:
        - Cloudflare (Deploy button or wrangler)
        - Docker / Docker Compose
        - Google Cloud Run
        - Standalone binary
        - Bun from source
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the admin under Settings, or the release you installed.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log lines
      description: The JSON log lines around the problem (they carry a request_id). Remove e-mail addresses and keys.
      render: text
