version: 2
updates:
  # bun.lock (Dependabot's bun ecosystem)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cloudflare:
        patterns: ["wrangler", "@cloudflare/*"]
      dev:
        dependency-type: development
  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    groups:
      playwright:
        patterns: ["@playwright/*", "@axe-core/*"]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
